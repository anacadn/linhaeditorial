<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<script>if(window.innerWidth>0&&window.innerWidth<=768){document.documentElement.className+=" is-mobile";}</script>
<title>Linha editorial - LaBela</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<style>:root{--background:oklch(1 0 0);--foreground:oklch(0.145 0 0);--card:oklch(1 0 0);--card-foreground:oklch(0.145 0 0);--primary:oklch(0.496 0.265 301.924);--primary-foreground:oklch(0.977 0.014 308.299);--secondary:oklch(0.967 0.001 286.375);--secondary-foreground:oklch(0.21 0.006 285.885);--muted:oklch(0.97 0 0);--muted-foreground:oklch(0.556 0 0);--destructive:oklch(0.577 0.245 27.325);--border:oklch(0.922 0 0);--input:oklch(0.922 0 0);--chart-1:oklch(0.827 0.119 306.383);--chart-2:oklch(0.627 0.265 303.9);--chart-3:oklch(0.558 0.288 302.321);--chart-4:oklch(0.496 0.265 301.924);--chart-5:oklch(0.438 0.218 303.724);--radius:0.625rem;--sidebar:oklch(0.985 0 0);--brand:var(--primary);--brand-fg:var(--primary-foreground);--brand-muted:oklch(0.95 0.04 305);--brand-subtle:oklch(0.98 0.015 305);--orange:#e66029;--orange-muted:#fdf0eb;--tx:var(--foreground);--tx-muted:var(--muted-foreground);--bd:var(--border);--bd-strong:oklch(0.86 0 0);--ok:oklch(0.527 0.154 150.069);--ok-bg:oklch(0.962 0.044 156.743);--ok-bd:oklch(0.792 0.124 154.05);--err:var(--destructive);--err-bg:oklch(0.971 0.02 17.38);--err-bd:oklch(0.856 0.065 17.38);--sh0:0 1px 2px oklch(0 0 0/.05);--sh1:0 1px 3px oklch(0 0 0/.08),0 1px 2px oklch(0 0 0/.04);--sh2:0 4px 12px oklch(0 0 0/.08),0 2px 4px oklch(0 0 0/.04);--sh3:0 8px 24px oklch(0 0 0/.1),0 4px 8px oklch(0 0 0/.04);--sh-brand:0 4px 14px oklch(0.496 0.265 301.924/.28);--r-sm:calc(var(--radius)*.6);--r:var(--radius);--r-md:calc(var(--radius)*1.2);--r-lg:calc(var(--radius)*1.6);--r-xl:calc(var(--radius)*2.4);--r-full:9999px;--t:150ms cubic-bezier(0.4,0,0.2,1);--tm:200ms cubic-bezier(0.4,0,0.2,1);}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-font-smoothing:antialiased;}
body{background:var(--background);font-family:"Montserrat",sans-serif;color:var(--tx);padding-bottom:80px;line-height:1.5;}
.main-header{background:linear-gradient(135deg,var(--chart-5) 0%,var(--primary) 45%,var(--chart-3) 100%);color:var(--brand-fg);padding:32px 48px 28px;text-align:center;position:relative;overflow:hidden;}
.main-header::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 70% 50%,oklch(1 0 0/.06) 0%,transparent 60%);pointer-events:none;}
.main-header h1{font-size:32px;font-weight:800;letter-spacing:-.75px;position:relative;z-index:1;}
.main-header .header-sub{font-size:11px;font-weight:600;letter-spacing:3px;text-transform:uppercase;opacity:.65;margin-top:6px;position:relative;z-index:1;}
.tabs-bar{background:var(--card);border-bottom:1px solid var(--bd);display:flex;gap:4px;padding:10px 40px;position:sticky;top:0;z-index:200;justify-content:center;box-shadow:var(--sh0);}
.tab-btn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:none;border-radius:var(--r-full);padding:8px 20px;font-family:"Montserrat",sans-serif;font-size:13px;font-weight:600;color:var(--tx-muted);cursor:pointer;white-space:nowrap;transition:background var(--t),color var(--t);}
.tab-btn:hover{background:var(--brand-muted);color:var(--brand);}
.tab-btn.active{background:var(--brand);color:var(--brand-fg);box-shadow:var(--sh-brand);}
.tab-btn .tab-icon,.tab-btn.active .tab-icon{stroke:currentColor;}
.tab-icon{width:14px;height:14px;stroke:currentColor;flex-shrink:0;}
.tab-pane{display:none;}.tab-pane.active{display:block;}
.container{max-width:1100px;margin:0 auto;padding:0 48px;}
.overview-labels{display:flex;gap:32px;margin:28px 0 8px;}
.overview-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--tx-muted);}
.overview-section{display:flex;gap:28px;margin-bottom:56px;align-items:flex-start;}
.feed-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--card);padding:3px;border:1px solid var(--bd);border-radius:var(--r-lg);overflow:hidden;flex:1;box-shadow:var(--sh0);}
.feed-item{aspect-ratio:3/4;background:var(--brand-muted);overflow:hidden;transition:opacity var(--t);}
.feed-item:hover{opacity:.85;}
.feed-item img{width:100%;height:100%;object-fit:cover;display:block;}
.feed-item.empty{background:var(--secondary);display:flex;align-items:center;justify-content:center;}
.feed-item.empty span{font-size:18px;font-weight:900;color:var(--brand);opacity:.4;}
.table-wrapper{flex:1;overflow:hidden;border:1px solid var(--bd);border-radius:var(--r-lg);background:var(--card);box-shadow:var(--sh0);}
.summary-table{width:100%;border-collapse:collapse;font-size:12px;}
.summary-table td{padding:0 10px;border-bottom:1px solid var(--bd);vertical-align:middle;height:34px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.summary-table tr:last-child td{border-bottom:none;}
.summary-table tr:hover td{background:var(--brand-subtle);}
.td-date{background:var(--orange);color:#fff;font-weight:700;text-align:center;width:60px;font-size:11px;}
.td-day{background:var(--brand);color:var(--brand-fg);text-align:center;font-size:11px;font-style:italic;width:80px;}
.td-type{font-weight:700;font-size:11px;color:var(--tx);width:80px;}
.td-tema{color:var(--tx-muted);font-size:12px;}
.section-title{font-size:22px;font-weight:800;letter-spacing:-.4px;color:var(--tx);margin:28px 0 20px;}
.post-block{margin-bottom:20px;background:var(--card);border-radius:var(--r-xl);border:1px solid var(--bd);box-shadow:var(--sh1);overflow:hidden;transition:box-shadow var(--tm),border-color var(--tm);}
.post-block:hover{box-shadow:var(--sh2);border-color:var(--bd-strong);}
.post-header{display:flex;align-items:flex-start;justify-content:space-between;padding:24px 28px 0;}
.post-header-left{display:flex;flex-direction:column;gap:8px;}
.post-date{font-size:12px;font-weight:600;color:var(--tx-muted);}
.post-info{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.post-name{font-size:15px;font-weight:700;color:var(--tx);}
.post-index{font-size:36px;font-weight:900;color:var(--bd-strong);line-height:1;letter-spacing:-2px;user-select:none;flex-shrink:0;}
.badge{padding:3px 10px;border-radius:var(--r-full);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;border:1px solid transparent;}
.badge-post{background:var(--brand-muted);color:var(--brand);border-color:oklch(0.88 0.07 305);}
.badge-reels{background:#fce7f3;color:#9d174d;border-color:#f9a8d4;}
.badge-carrossel{background:var(--orange-muted);color:#9a3412;border-color:#fed7aa;}
.badge-stories{background:#ecfdf5;color:#065f46;border-color:#6ee7b7;}
.badge:not(.badge-post):not(.badge-reels):not(.badge-carrossel):not(.badge-stories){background:var(--secondary);color:var(--secondary-foreground);}
.media-container{padding:20px 28px;display:flex;justify-content:center;}
.media-single{display:flex;justify-content:center;}
.media-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.8px;color:var(--tx-muted);margin-bottom:8px;display:block;text-align:center;}
.preview-card{display:flex;flex-direction:column;align-items:center;}
.frame{border-radius:var(--r-md);overflow:hidden;border:1px solid var(--bd);background:#09090b;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh0);}
.frame-empty{color:#fff;flex-direction:column;text-align:center;padding:20px;font-size:10px;font-weight:700;text-transform:uppercase;opacity:.4;}
.frame-post{width:250px;aspect-ratio:4/5;}
.frame-reels{width:190px;aspect-ratio:9/16;}
.frame img{width:100%;height:100%;object-fit:cover;display:block;}
iframe{width:100%;height:100%;border:none;display:block;}
.drive-link{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:var(--r-full);border:1px solid var(--bd);background:var(--card);color:var(--tx-muted);text-decoration:none;font-size:11px;font-weight:600;transition:border-color var(--t),color var(--t),background var(--t);}
.drive-link:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-subtle);}
.carousel-wrap{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;width:100%;}
.carousel-wrap .preview-card{width:250px;}
.carousel-wrap .frame-post{width:100%;}
.scroll-dots{display:none;}
.is-mobile .scroll-dots{display:flex;gap:6px;justify-content:center;margin-top:8px;}
.dot-item{width:6px;height:6px;border-radius:50%;background:var(--bd-strong);transition:background var(--t),width var(--t);}
.dot-item.active{background:var(--brand);width:16px;border-radius:var(--r-full);}
.caption-wrap{padding:0 28px 20px;}
.caption-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--tx-muted);display:block;margin-bottom:8px;}
.caption-box{background:var(--sidebar);border:1px solid var(--bd);border-radius:var(--r-md);padding:16px 18px;font-size:13.5px;line-height:1.75;color:var(--tx-muted);white-space:pre-wrap;}
.no-copy{font-style:italic;color:var(--tx-muted);}
.cal-nav,.posts-nav{display:flex;align-items:center;justify-content:center;gap:16px;padding:24px 0 16px;}
.posts-nav{padding:20px 0 12px;}
.posts-mes{display:none;}.posts-mes.active{display:block;}
.cal-btn{width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--brand-fg);border:none;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-brand);transition:background var(--t),transform var(--t);}
.cal-btn:hover:not(:disabled){background:var(--chart-3);transform:scale(1.08);}
.cal-btn:disabled{opacity:0;pointer-events:none;}
.cal-label{font-size:18px;font-weight:800;color:var(--tx);min-width:260px;text-align:center;letter-spacing:-.3px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cal-dow{text-align:center;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--tx-muted);padding:2px 0 8px;}
.cal-cell{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);min-height:100px;padding:7px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--sh0);}
.cal-cell-empty{background:transparent;border-color:transparent;box-shadow:none;}
.cal-cell-post{border-color:var(--bd-strong);cursor:pointer;transition:box-shadow var(--tm),transform var(--tm),border-color var(--t);}
.cal-cell-post:hover{box-shadow:var(--sh2);transform:translateY(-2px);border-color:var(--brand);}
.cal-day-num{font-size:10px;font-weight:700;color:var(--tx-muted);align-self:flex-end;line-height:1;}
.cal-cell-post .cal-day-num{color:var(--brand);}
.cal-post{display:flex;flex-direction:column;gap:3px;border-radius:var(--r-sm);overflow:hidden;}
.cal-thumb{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:4px;display:block;}
.cal-thumb-empty{width:100%;aspect-ratio:4/5;background:var(--secondary);border-radius:4px;display:flex;align-items:center;justify-content:center;}
.cal-thumb-empty span{font-size:14px;font-weight:900;color:var(--brand);opacity:.5;}
.cal-post-info{padding:1px 1px 3px;display:flex;flex-direction:column;gap:1px;}
.cal-tag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--orange);}
.cal-tema{font-size:9.5px;color:var(--tx-muted);font-weight:500;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.feedback-bar{padding:16px 28px 24px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:12px;}
.fb-btns{display:flex;gap:10px;justify-content:center;align-items:center;}
.btn-aprovar,.btn-reprovar{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 0;width:168px;border:none;border-radius:var(--r-full);font-family:"Montserrat",sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:opacity var(--t),transform var(--t);}
.btn-aprovar{background:var(--ok);color:#fff;box-shadow:0 2px 8px oklch(0.527 0.154 150.069/.3);}
.btn-reprovar{background:var(--err);color:#fff;box-shadow:0 2px 8px oklch(0.577 0.245 27.325/.25);}
.btn-aprovar:hover,.btn-reprovar:hover{opacity:.88;transform:translateY(-1px);}
.btn-aprovar:active,.btn-reprovar:active{transform:translateY(0);}
.reprovar-form{display:none;flex-direction:column;gap:10px;background:var(--err-bg);padding:16px;border-radius:var(--r-lg);border:1px solid var(--err-bd);}
.reprovar-form textarea{width:100%;padding:12px 14px;border:1.5px solid var(--err-bd);border-radius:var(--r-md);font-family:"Montserrat",sans-serif;font-size:13px;resize:vertical;min-height:80px;outline:none;background:#fff;color:var(--tx);transition:border-color var(--t);}
.reprovar-form textarea:focus{border-color:var(--err);}
.form-actions{display:flex;gap:8px;flex-wrap:wrap;}
.btn-cancelar{padding:9px 20px;border:1px solid var(--bd-strong);border-radius:var(--r-full);background:#fff;color:var(--tx-muted);font-family:"Montserrat",sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:border-color var(--t),color var(--t);}
.btn-cancelar:hover{border-color:var(--tx);color:var(--tx);}
.btn-confirmar{padding:9px 20px;background:var(--err);color:#fff;border:none;border-radius:var(--r-full);font-family:"Montserrat",sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:opacity var(--t);}
.btn-confirmar:hover{opacity:.85;}
.status-container{margin-top:2px;}
.status-badge{padding:10px 0;border-radius:var(--r-full);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;width:190px;border:1px solid transparent;}
.status-aprovado{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-bd);}
.status-reprovado{background:var(--err-bg);color:var(--err);border-color:var(--err-bd);}
.btn-alterar{background:none;border:none;font-family:"Montserrat",sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:var(--tx-muted);text-decoration:underline;padding:0;display:inline-flex;align-items:center;gap:4px;transition:color var(--t);}
.btn-alterar:hover{color:var(--tx);}
.obs-edit-box{margin-top:10px;display:flex;flex-direction:column;gap:8px;background:var(--err-bg);padding:14px;border-radius:var(--r-lg);border:1px solid var(--err-bd);}
.obs-edit-actions{display:flex;gap:8px;justify-content:flex-end;}
.obs-edit-textarea{width:100%;padding:12px 14px;border:1.5px solid var(--err-bd);border-radius:var(--r-md);font-family:"Montserrat",sans-serif;font-size:13px;resize:vertical;min-height:72px;outline:none;background:#fff;color:var(--tx);}
.obs-edit-textarea[readonly]{cursor:default;}
.obs-edit-textarea:not([readonly]):focus{border-color:var(--err);}
.btn-editar{padding:7px 16px;border:1px solid var(--bd-strong);border-radius:var(--r-full);background:#fff;color:var(--tx-muted);font-family:"Montserrat",sans-serif;font-size:11px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:border-color var(--t),color var(--t);}
.btn-editar:hover{border-color:var(--brand);color:var(--brand);}
.btn-atualizar{padding:8px 18px;background:var(--tx);color:#fff;border:none;border-radius:var(--r-full);font-family:"Montserrat",sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:opacity var(--t);}
.btn-atualizar:hover{opacity:.8;}
.post-block.aprovado{border-color:var(--ok-bd);box-shadow:0 0 0 1px var(--ok-bd);}
.post-block.reprovado{border-color:var(--err-bd) !important;box-shadow:0 0 0 1px var(--err-bd) !important;}
.post-highlight{animation:hl 1.2s ease-out;}
@keyframes hl{0%{box-shadow:0 0 0 0 oklch(0.496 0.265 301.924/.35);}65%{box-shadow:0 0 0 14px oklch(0.496 0.265 301.924/0);}100%{box-shadow:var(--sh2);}}
.back-top{position:fixed;bottom:28px;right:28px;z-index:999;width:42px;height:42px;border-radius:50%;background:var(--brand);color:var(--brand-fg);border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-brand);opacity:0;pointer-events:none;transition:opacity var(--tm),transform var(--tm);transform:translateY(8px);}
.back-top.visible{opacity:1;pointer-events:auto;transform:translateY(0);}
#loginOverlay{position:fixed;inset:0;background:linear-gradient(135deg,var(--chart-5) 0%,var(--primary) 100%);z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity .3s;}
.login-box{background:#fff;border-radius:var(--r-xl);padding:40px 36px;display:flex;flex-direction:column;align-items:center;gap:18px;width:320px;box-shadow:var(--sh3);}
.login-logo{width:44px;height:44px;background:var(--brand);border-radius:var(--r);display:flex;align-items:center;justify-content:center;}
.login-logo svg{stroke:#fff;}
.login-box h2{font-size:18px;font-weight:800;color:var(--tx);text-align:center;letter-spacing:-.3px;}
.login-box p{font-size:13px;color:var(--tx-muted);text-align:center;margin-top:-6px;}
.login-box input{width:100%;padding:12px 16px;border:1.5px solid var(--bd);border-radius:var(--r-full);font-family:"Montserrat",sans-serif;font-size:16px;outline:none;text-align:center;letter-spacing:6px;background:var(--secondary);color:var(--tx);transition:border-color var(--t),box-shadow var(--t);}
.login-box input:focus{border-color:var(--brand);box-shadow:0 0 0 3px oklch(0.496 0.265 301.924/.15);background:#fff;}
.login-box button{width:100%;padding:12px;background:var(--brand);color:var(--brand-fg);border:none;border-radius:var(--r-full);font-family:"Montserrat",sans-serif;font-size:14px;font-weight:700;cursor:pointer;box-shadow:var(--sh-brand);transition:opacity var(--t),transform var(--t);}
.login-box button:hover{opacity:.9;transform:translateY(-1px);}
#erroSenha{color:var(--err);font-size:12px;font-weight:600;display:none;text-align:center;}
@keyframes shake{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
.lightbox-overlay{display:none;position:fixed;inset:0;background:oklch(0 0 0/.9);z-index:900;align-items:center;justify-content:center;backdrop-filter:blur(6px);}
.lightbox-overlay.open{display:flex;}
.lightbox-img{max-width:95vw;max-height:90vh;object-fit:contain;border-radius:var(--r-lg);touch-action:pinch-zoom;}
.lightbox-close{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:oklch(1 0 0/.12);border:1px solid oklch(1 0 0/.2);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background var(--t);}
.lightbox-close:hover{background:oklch(1 0 0/.22);}
.m-header{display:none;flex-direction:column;background:linear-gradient(135deg,var(--chart-5) 0%,var(--primary) 100%);color:var(--brand-fg);}
.m-header-top{padding:18px 18px 12px;}
.m-title{font-size:18px;font-weight:800;letter-spacing:-.3px;}
.m-tabs-row{display:flex;gap:6px;padding:0 18px 16px;overflow-x:auto;scrollbar-width:none;}
.m-tabs-row::-webkit-scrollbar{display:none;}
.m-tab{display:inline-flex;align-items:center;gap:5px;border:1.5px solid oklch(1 0 0/.3);border-radius:var(--r-full);padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:"Montserrat",sans-serif;background:transparent;color:#fff;transition:background var(--t),border-color var(--t);}
.m-tab .tab-icon{stroke:#fff;width:13px;height:13px;}
.m-tab.active{background:#fff;color:var(--brand);border-color:#fff;}
.m-tab.active .tab-icon{stroke:var(--brand);}
.is-mobile .main-header{display:none !important;}
.is-mobile .tabs-bar{display:none !important;}
.is-mobile .m-header{display:flex !important;}
.is-mobile body{padding-bottom:16px;}
.is-mobile .container{padding:0 14px !important;max-width:100vw !important;}
.is-mobile .overview-labels{display:none !important;}
.is-mobile .overview-section{flex-direction:column !important;gap:12px;margin-bottom:28px;}
.is-mobile .feed-grid{width:100% !important;}
.is-mobile .table-wrapper{height:auto !important;width:100% !important;overflow-x:auto;flex:none !important;}
.is-mobile .summary-table td{font-size:10px;padding:0 6px;white-space:normal;word-break:break-word;}
.is-mobile .section-title{font-size:18px;margin:18px 0 14px;}
.is-mobile .post-block{border-radius:var(--r-lg) !important;margin-bottom:14px;}
.is-mobile .post-header,.is-mobile .media-container,.is-mobile .caption-wrap,.is-mobile .feedback-bar{padding-left:16px !important;padding-right:16px !important;}
